[project]
name = "ipilot"
version = "0.0.0"
description = "IP Information Lookup Tool"
readme = "README.md"
authors = [
    {name = "Luke Tainton", email = "luke@tainton.uk"},
]
requires-python = "<4.0,>=3.11"

dependencies = [
    "requests==2.34.2",
    "tabulate==0.10.0",
]

[project.scripts]
app = "app.main:main"

[dependency-groups]
dev = [
    "coverage<8.0.0,>=7.5.0",
    "ruff>=0.12.0",
    "pytest<9.1.2,>=9.1.1",
    "requests-mock<2.0.0,>=1.12.1",
]

[tool.pdm.build]
includes = []

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
